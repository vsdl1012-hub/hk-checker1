name: HK Stock Checker

on:
  workflow_dispatch:

jobs:
  checker:
    runs-on: ubuntu-latest

    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          pip install requests selenium webdriver-manager

      - name: Start checker
        run: |
          python checker.py
